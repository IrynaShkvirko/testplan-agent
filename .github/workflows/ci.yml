name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Demo runs and the committed sample plans are current
        run: |
          python demo/run_demo.py
          git diff --exit-code -- demo/plans demo/changes

  # The one check a ruleset requires, so the matrix can change without editing the ruleset.
  # It must run even when a test job fails: a skipped required check counts as passing.
  ci-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        run: test "${{ needs.test.result }}" = "success"
